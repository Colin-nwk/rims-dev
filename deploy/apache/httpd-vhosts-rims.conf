# ==============================================================================
# RIMS (Registry Information Management System) - Apache VirtualHost Configuration
# Target: Office LAN Intranet (https://rims.ng)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Internal Laravel Backend API (Localhost Only, Port 8081)
#    Isolated from LAN direct access. Only reachable via Apache reverse proxy.
# ------------------------------------------------------------------------------
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ServerName rims-api.internal
    DocumentRoot "C:/xampp/htdocs/rims/backend/public"

    <Directory "C:/xampp/htdocs/rims/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
    </Directory>

    ErrorLog  "logs/rims-api-error.log"
    CustomLog "logs/rims-api-access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. Public HTTP Redirect -> HTTPS (rims.ng Port 80)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName rims.ng
    ServerAlias www.rims.ng

    # Redirect all HTTP requests to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://rims.ng$1 [R=301,L]

    ErrorLog  "logs/rims-http-error.log"
    CustomLog "logs/rims-http-access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. Public HTTPS Portal (rims.ng Port 443)
#    Serves React SPA frontend and proxies API/Storage to internal Laravel vhost.
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName rims.ng
    ServerAlias www.rims.ng
    DocumentRoot "C:/xampp/htdocs/rims/frontend-new/dist"

    SSLEngine on
    SSLCertificateFile    "conf/ssl.crt/rims.crt"
    SSLCertificateKeyFile "conf/ssl.key/rims.key"

    # Reverse proxy: forward /api, /storage, /up to local Laravel backend
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        /api/     http://127.0.0.1:8081/api/
    ProxyPassReverse /api/     http://127.0.0.1:8081/api/

    ProxyPass        /storage/ http://127.0.0.1:8081/storage/
    ProxyPassReverse /storage/ http://127.0.0.1:8081/storage/

    ProxyPass        /up       http://127.0.0.1:8081/up
    ProxyPassReverse /up       http://127.0.0.1:8081/up

    # React SPA Static Files & BrowserRouter Fallback
    <Directory "C:/xampp/htdocs/rims/frontend-new/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Caching strategy: immutable build assets, no-cache for index.html
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog  "logs/rims-ssl-error.log"
    CustomLog "logs/rims-ssl-access.log" combined
</VirtualHost>
