name: Deploy to Render

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for frontend changes
        id: check-frontend
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD^ HEAD | grep -q '^frontend-new/' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-frontend.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        if: steps.check-frontend.outputs.changed == 'true'
        working-directory: ./frontend-new
        run: npm ci

      - name: Build frontend
        if: steps.check-frontend.outputs.changed == 'true'
        working-directory: ./frontend-new
        run: npm run build

      - name: Trigger Render Frontend Deployment
        if: steps.check-frontend.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo "✅ Frontend deployment triggered successfully"

      - name: Skip Frontend Deployment
        if: steps.check-frontend.outputs.changed == 'false'
        run: echo "⏭️ No changes in frontend-new/ - skipping frontend deployment"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for backend changes
        id: check-backend
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD^ HEAD | grep -q '^backend/' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        if: steps.check-backend.outputs.changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo, mysql
          coverage: none

      - name: Copy .env
        if: steps.check-backend.outputs.changed == 'true'
        working-directory: ./backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        if: steps.check-backend.outputs.changed == 'true'
        working-directory: ./backend
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Generate application key
        if: steps.check-backend.outputs.changed == 'true'
        working-directory: ./backend
        run: php artisan key:generate

      - name: Run tests
        if: steps.check-backend.outputs.changed == 'true'
        working-directory: ./backend
        run: php artisan test

      - name: Trigger Render Backend Deployment
        if: steps.check-backend.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo "✅ Backend deployment triggered successfully"

      - name: Skip Backend Deployment
        if: steps.check-backend.outputs.changed == 'false'
        run: echo "⏭️ No changes in backend/ - skipping backend deployment"
